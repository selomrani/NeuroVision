[project]
name = "neurovision"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soufyane El Omrani", email = "elomranisoufyan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "azure-storage-blob>=12.31.0",
    "google>=3.0.0",
    "ipykernel>=7.4.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "panda>=0.3.1",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "streamlit>=1.66.0",
    "tensorflow>=2.21.0",
]

[project.scripts]
neurovision = "neurovision:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
